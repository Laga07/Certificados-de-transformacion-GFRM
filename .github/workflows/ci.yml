name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar y probar contratos
        run: npm run contracts:compile && npm run contracts:test

      # El cliente de Prisma (src/generated) no esta en git: sin este paso el typecheck del
      # backend no encuentra los tipos. Fue la causa de que el CI fallara desde el Sprint 1.
      - name: Generar cliente de Prisma
        run: npm run backend:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Typecheck + lint + build backend
        run: npm run backend:typecheck && npm run backend:lint && npm run build --workspace=packages/backend

      - name: Typecheck + lint frontend
        run: npm run frontend:typecheck && npm run frontend:lint

  # Construye las imagenes de produccion (sin publicarlas) para detectar un Dockerfile roto
  # antes de que llegue al servidor. La maquina de desarrollo no tiene Docker: este job es
  # la unica prueba real de los Dockerfiles.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/frontend/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://ci.invalid
            NEXT_PUBLIC_AMOY_RPC_URL=https://polygon-amoy-bor-rpc.publicnode.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Compose de produccion valido
        run: |
          cp deploy/.env.prod.example deploy/.env.prod
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/; s/^JWT_SECRET=.*/JWT_SECRET=ci/' deploy/.env.prod
          docker compose --env-file deploy/.env.prod -f docker-compose.prod.yml config --quiet

  # Analisis estatico de los contratos (plan de produccion, A8). BLOQUEANTE para hallazgos
  # de severidad media o alta. Se compila con solc directo (no via Hardhat 3, que
  # crytic-compile no entiende) sobre MercadoCertificados.sol, que importa los otros tres.
  # Los hallazgos revisados y aceptados se marcan en el codigo con slither-disable-next-line
  # y una justificacion.
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Slither y solc 0.8.24
        run: |
          pip install --quiet slither-analyzer solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Slither (falla con hallazgos medios o altos)
        working-directory: packages/contracts
        run: >
          slither contracts/MercadoCertificados.sol
          --compile-force-framework solc
          --solc-remaps "@openzeppelin/=../../node_modules/@openzeppelin/"
          --solc-args "--via-ir --optimize --evm-version cancun"
          --filter-paths node_modules
          --exclude-informational --exclude-optimization --exclude-low
          --fail-medium
