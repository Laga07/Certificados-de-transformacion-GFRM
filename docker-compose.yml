# Alternativa para quien SI tenga Docker instalado. Esta maquina de desarrollo no lo tiene,
# asi que el setup real usa una segunda instancia nativa de PostgreSQL en vez de esto -- ver
# scripts/db.mjs y "npm run db:up" en el README. Ambos caminos llegan al mismo lugar (DB
# propia de este proyecto en localhost:5433, sin compartir nada con otros proyectos); si
# tenes Docker y preferis containers, este archivo sigue siendo valido.
services:
  postgres:
    image: postgres:16-alpine
    container_name: certificado-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: certificado_transformacion
    ports:
      # Puerto de host distinto (5433) a proposito: permite correr esta DB al mismo tiempo
      # que la de DAPP Plastico Tesis (que usa 5432) sin que choquen.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: certificado-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@certificado.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres-data:
